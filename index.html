<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shot on iPhone Watermark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
        }

        #previewCanvas {
            max-width: 100%;
            border: 1px solid #ddd;
            background: #fff;
        }

        .preview-wrap {
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="h3 mb-4">Shot on iPhone Watermark</h1>

        <div class="row g-4">
            <!-- Form -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h2 class="h6 mb-3">Pengaturan Watermark</h2>

                        <div class="mb-3">
                            <label class="form-label">Upload Foto</label>
                            <input type="file" id="photoInput" class="form-control" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Model iPhone</label>
                            <input type="text" id="deviceModel" class="form-control" value="iPhone 13">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tanggal & Jam</label>
                            <input type="datetime-local" id="dateTime" class="form-control">
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Focal Length (mm)</label>
                                <input type="number" id="focalLength" class="form-control" value="26" min="1">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Aperture (f)</label>
                                <input type="number" id="aperture" class="form-control" value="1.6" step="0.1"
                                    min="0.1">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">ISO</label>
                                <input type="number" id="iso" class="form-control" value="32" min="1">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Shutter Speed</label>
                                <input type="text" id="shutter" class="form-control" value="1/1284"
                                    placeholder="contoh: 1/1284">
                            </div>
                        </div>

                        <button id="downloadBtn" class="btn btn-primary w-100" disabled>
                            Download Gambar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Preview -->
            <div class="col-lg-8">
                <div class="preview-wrap">
                    <p class="text-muted small mb-2">Preview</p>
                    <canvas id="previewCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        let sourceImage = null;

        // Set default datetime = sekarang
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('dateTime').value = now.toISOString().slice(0, 16);

        // Apple logo SVG sebagai data URL (hitam)
        const appleLogoSvg = `
            <svg fill="#000000" width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.71 19.5C17.88 20.74 17 21.95 15.66 21.97C14.32 22 13.89 21.18 12.37 21.18C10.84 21.18 10.37 21.95 9.09997 22C7.78997 22.05 6.79997 20.68 5.95997 19.47C4.24997 17 2.93997 12.45 4.69997 9.39C5.56997 7.87 7.12997 6.91 8.81997 6.88C10.1 6.86 11.32 7.75 12.11 7.75C12.89 7.75 14.37 6.68 15.92 6.84C16.57 6.87 18.39 7.1 19.56 8.82C19.47 8.88 17.39 10.1 17.41 12.63C17.44 15.65 20.06 16.66 20.09 16.67C20.06 16.74 19.67 18.11 18.71 19.5ZM13 3.5C13.73 2.67 14.94 2.04 15.94 2C16.07 3.17 15.6 4.35 14.9 5.19C14.21 6.04 13.07 6.7 11.95 6.61C11.8 5.46 12.36 4.26 13 3.5Z"/>
            </svg>`;
        const appleLogo = new Image();
        appleLogo.src = 'data:image/svg+xml;base64,' + btoa(appleLogoSvg);

        // Format tanggal: "20 Jul 2026 15.41.52"
        function formatDateTime(isoString) {
            const d = new Date(isoString);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = String(d.getDate()).padStart(2, '0');
            const month = months[d.getMonth()];
            const year = d.getFullYear();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            return `${day} ${month} ${year} ${h}.${m}`;
        }

        function getValues() {
            return {
                device: document.getElementById('deviceModel').value || 'iPhone 13',
                dateTime: document.getElementById('dateTime').value,
                focal: document.getElementById('focalLength').value || '26',
                aperture: document.getElementById('aperture').value || '1.6',
                iso: document.getElementById('iso').value || '32',
                shutter: document.getElementById('shutter').value || '1/1284',
            };
        }

        function drawWatermark() {
            if (!sourceImage) return;

            const img = sourceImage;
            const barHeight = Math.max(72, Math.round(img.width * 0.08)); // ~8% lebar foto
            const padding = Math.round(barHeight * 0.25);
            const fontSize = Math.round(barHeight * 0.22);
            const smallFont = Math.round(barHeight * 0.16);
            const logoSize = Math.round(barHeight * 0.45);

            canvas.width = img.width;
            canvas.height = img.height + barHeight;

            // Gambar asli
            ctx.drawImage(img, 0, 0);

            // Bar putih
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, img.height, img.width, barHeight);

            const v = getValues();
            const dateStr = formatDateTime(v.dateTime);
            const fontFamily = '"Helvetica Neue", Helvetica, Arial, sans-serif';

            ctx.fillStyle = '#000000';
            ctx.textBaseline = 'middle';

            // Logo Apple (kiri)
            const logoY = img.height + barHeight / 2 - logoSize / 2;
            ctx.drawImage(appleLogo, padding, logoY, logoSize, logoSize);

            // Teks kiri: "Shot on iPhone 13" + tanggal
            const textX = padding + logoSize + padding * 0.6;
            const centerY = img.height + barHeight / 2;

            ctx.font = `600 ${fontSize}px ${fontFamily}`;
            const shotOn = 'Shot on ';
            const device = v.device;
            ctx.fillText(shotOn, textX, centerY - smallFont * 0.7);
            const shotOnWidth = ctx.measureText(shotOn).width;
            ctx.font = `700 ${fontSize}px ${fontFamily}`;
            ctx.fillText(device, textX + shotOnWidth, centerY - smallFont * 0.7);

            ctx.font = `400 ${smallFont}px ${fontFamily}`;
            ctx.fillStyle = '#333333';
            ctx.fillText(dateStr, textX, centerY + smallFont * 0.9);

            // Teks kanan: EXIF (2 baris)
            ctx.fillStyle = '#000000';
            ctx.font = `400 ${fontSize}px ${fontFamily}`;
            const line1 = `${v.focal} mm    ƒ ${v.aperture}`;
            const line2 = `ISO ${v.iso}    ${v.shutter} s`;

            const line1Width = ctx.measureText(line1).width;
            const line2Width = ctx.measureText(line2).width;
            const maxRightWidth = Math.max(line1Width, line2Width);
            const rightX = img.width - padding - maxRightWidth;

            ctx.fillText(line1, rightX, centerY - smallFont * 0.7);
            ctx.fillText(line2, rightX, centerY + smallFont * 0.9);
        }

        // Upload foto
        document.getElementById('photoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    sourceImage = img;
                    drawWatermark();
                    document.getElementById('downloadBtn').disabled = false;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Update preview saat form berubah
        ['deviceModel', 'dateTime', 'focalLength', 'aperture', 'iso', 'shutter'].forEach(id => {
            document.getElementById(id).addEventListener('input', drawWatermark);
        });

        // Download
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'shot-on-iphone.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        // Redraw setelah logo siap
        appleLogo.onload = drawWatermark;
    </script>
</body>

</html>
